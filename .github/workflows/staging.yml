name: Staging Distribution

on:
  push:
    branches: [develop]

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Unit tests (fast, ubuntu) ────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
          cache-key: flutter-sdk-${{ runner.os }}-3.41.6

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
          save-always: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test test/unit/

  # ── Job 2: Android distribution (parallel with iOS) ─────────────────────────
  distribute-android:
    name: Distribute Android (Staging)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
          cache-key: flutter-sdk-${{ runner.os }}-3.41.6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
          save-always: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-
          save-always: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android/app/release.keystore
          cat <<EOF > android/key.properties
          storeFile=release.keystore
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Distribute staging Android
        run: bundle exec fastlane android distribute_staging_android
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/release.keystore android/key.properties

      - name: Notify Slack — Android failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Staging Android distribution failed\nBranch: ${{ github.ref_name }}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── Job 3: iOS distribution (parallel with Android) ─────────────────────────
  distribute-ios:
    name: Distribute iOS (Staging)
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
          cache-key: flutter-sdk-${{ runner.os }}-3.41.6

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
          save-always: true

      - name: Cache CocoaPods spec repos
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods/repos
          key: cocoapods-repos-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: cocoapods-repos-${{ runner.os }}-
          save-always: true

      - name: Cache CocoaPods Pods dir
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-
          save-always: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Fastlane
        run: bundle install

      - name: Remove stale CocoaPods master spec repo
        run: rm -rf ~/.cocoapods/repos/master || true

      - name: Initialize CocoaPods CDN trunk
        run: bundle exec pod repo add-cdn trunk https://cdn.cocoapods.org/ 2>/dev/null || true
        env:
          COCOAPODS_DISABLE_STATS: 1

      - name: Install pod wrapper (smart no-op for Flutter's implicit pod install)
        # Flutter's `flutter build ipa` triggers `pod install` DURING xcodebuild
        # because [CP] Check Pods Manifest.lock detects a mismatch after Flutter
        # regenerates Release xcconfig. Calling the real pod hangs on CDN.
        #
        # Solution: when Pods/ is already installed, wrapper just copies
        # Podfile.lock -> Pods/Manifest.lock (they're identical by spec) and
        # exits 0. No network. bundle exec pod bypasses PATH so the explicit
        # Install CocoaPods step below is unaffected.
        run: |
          REAL_POD=$([[ -x /opt/homebrew/bin/pod ]] && echo /opt/homebrew/bin/pod || echo /usr/local/bin/pod)
          echo "Real pod: $REAL_POD ($($REAL_POD --version))"
          mkdir -p "$HOME/bin"
          # Write wrapper using printf (avoids heredoc quoting issues)
          printf '#!/bin/bash\n' > "$HOME/bin/pod"
          printf 'echo "[WRAPPER] pod from $PWD: $@" >&2\n' >> "$HOME/bin/pod"
          printf 'if [[ "$1" == "install" ]] && [[ -f "Pods/Manifest.lock" ]]; then\n' >> "$HOME/bin/pod"
          printf '  cp "Podfile.lock" "Pods/Manifest.lock"\n' >> "$HOME/bin/pod"
          printf '  echo "[WRAPPER] synced lock files, no CDN needed" >&2\n' >> "$HOME/bin/pod"
          printf '  exit 0\n' >> "$HOME/bin/pod"
          printf 'fi\n' >> "$HOME/bin/pod"
          printf 'A=()\n' >> "$HOME/bin/pod"
          printf 'for x in "$@"; do [[ "$x" != "--repo-update" ]] && A+=("$x"); done\n' >> "$HOME/bin/pod"
          printf 'A+=("--no-repo-update")\n' >> "$HOME/bin/pod"
          printf 'exec "%s" "${A[@]}"\n' "$REAL_POD" >> "$HOME/bin/pod"
          chmod +x "$HOME/bin/pod"
          echo "--- wrapper ---" && cat "$HOME/bin/pod"
          echo "PATH=$HOME/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install CocoaPods
        run: cd ios && bundle exec pod install --no-repo-update
        env:
          COCOAPODS_DISABLE_STATS: 1

      - name: Distribute staging iOS
        run: bundle exec fastlane ios distribute_staging_ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          COCOAPODS_DISABLE_STATS: 1

      - name: Notify Slack — iOS failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Staging iOS distribution failed\nBranch: ${{ github.ref_name }}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── Job 4: Notify success when both platforms pass ───────────────────────────
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [distribute-android, distribute-ios]
    if: success()
    steps:
      - name: Notify Slack — success
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Staging distributed to Android + iOS\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
