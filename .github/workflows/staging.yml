name: Staging Distribution

on:
  push:
    branches: [develop]

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Unit tests (fast, ubuntu) ────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
          cache-key: flutter-sdk-${{ runner.os }}-3.41.6

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
          save-always: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test test/unit/

  # ── Job 2: Android distribution (parallel with iOS) ─────────────────────────
  distribute-android:
    name: Distribute Android (Staging)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
          cache-key: flutter-sdk-${{ runner.os }}-3.41.6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
          save-always: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-
          save-always: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android/app/release.keystore
          cat <<EOF > android/key.properties
          storeFile=release.keystore
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Distribute staging Android
        run: bundle exec fastlane android distribute_staging_android
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/release.keystore android/key.properties

      - name: Notify Slack — Android failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Staging Android distribution failed\nBranch: ${{ github.ref_name }}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── Job 3: iOS distribution (parallel with Android) ─────────────────────────
  distribute-ios:
    name: Distribute iOS (Staging)
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
          cache-key: flutter-sdk-${{ runner.os }}-3.41.6

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
          save-always: true

      - name: Cache CocoaPods spec repos
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods/repos
          key: cocoapods-repos-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: cocoapods-repos-${{ runner.os }}-
          save-always: true

      - name: Cache CocoaPods Pods dir
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-
          save-always: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Fastlane
        run: bundle install

      - name: Remove stale CocoaPods master spec repo
        run: rm -rf ~/.cocoapods/repos/master || true

      - name: Initialize CocoaPods CDN trunk
        run: bundle exec pod repo add-cdn trunk https://cdn.cocoapods.org/ 2>/dev/null || true
        env:
          COCOAPODS_DISABLE_STATS: 1

      - name: Patch pod binaries to force --no-repo-update
        # Flutter's Dart process calls 'pod install' (no --no-repo-update) which
        # triggers CDN spec-repo update HTTPS calls that hang on GitHub Actions.
        # We patch every pod binary we can find with a thin bash wrapper.
        # Debug prefix "[WRAPPER]" in CI log confirms which binary Flutter calls.
        run: |
          patch_pod() {
            local target="$1" use_sudo="$2"
            [[ -f "$target" ]] || { echo "SKIP (not found): $target"; return; }
            local real="${target}.real"
            local wrapper
            wrapper=$(printf '#!/bin/bash\necho "[WRAPPER] pod called: $@" >&2\nA=()\nfor x in "$@"; do [[ "$x" != "--repo-update" ]] && A+=("$x"); done\nA+=("--no-repo-update")\nexec "%s" "${A[@]}"\n' "$real")
            echo "=== Patching: $target ==="
            if [[ "$use_sudo" == "sudo" ]]; then
              sudo cp "$target" "$real"
              echo "$wrapper" | sudo tee "$target" > /dev/null
              sudo chmod +x "$target"
            else
              cp "$target" "$real"
              echo "$wrapper" > "$target"
              chmod +x "$target"
            fi
            echo "Wrapper at $target -> $real"
            head -3 "$target"
          }

          # 1. Bundled pod via Gem.bindir (immune to PATH ambiguity)
          GEM_BINDIR=$(bundle exec ruby -e 'require "rubygems"; print Gem.bindir')
          echo "GEM_BINDIR=$GEM_BINDIR"
          patch_pod "$GEM_BINDIR/pod"

          # 2. System pod locations Flutter may resolve when PATH differs
          patch_pod /opt/homebrew/bin/pod sudo
          patch_pod /usr/local/bin/pod  sudo

          echo "=== which pod: $(which pod 2>/dev/null) ==="
          echo "=== bundle exec pod: $(bundle exec bash -c 'which pod' 2>/dev/null) ==="

      - name: Install CocoaPods
        run: cd ios && bundle exec pod install --no-repo-update
        env:
          COCOAPODS_DISABLE_STATS: 1

      - name: Distribute staging iOS
        run: bundle exec fastlane ios distribute_staging_ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          COCOAPODS_DISABLE_STATS: 1

      - name: Notify Slack — iOS failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Staging iOS distribution failed\nBranch: ${{ github.ref_name }}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── Job 4: Notify success when both platforms pass ───────────────────────────
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [distribute-android, distribute-ios]
    if: success()
    steps:
      - name: Notify Slack — success
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Staging distributed to Android + iOS\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
