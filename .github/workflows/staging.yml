name: Staging Distribution

on:
  push:
    branches: [develop]

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Unit tests (fast, ubuntu) ────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
          cache-key: flutter-sdk-${{ runner.os }}-3.41.6

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
          save-always: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test test/unit/

  # ── Job 2: Android distribution (parallel with iOS) ─────────────────────────
  distribute-android:
    name: Distribute Android (Staging)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
          cache-key: flutter-sdk-${{ runner.os }}-3.41.6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
          save-always: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-
          save-always: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android/app/release.keystore
          cat <<EOF > android/key.properties
          storeFile=release.keystore
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Distribute staging Android
        run: bundle exec fastlane android distribute_staging_android
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/release.keystore android/key.properties

      - name: Notify Slack — Android failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Staging Android distribution failed\nBranch: ${{ github.ref_name }}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── Job 3: iOS distribution (parallel with Android) ─────────────────────────
  distribute-ios:
    name: Distribute iOS (Staging)
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
          cache-key: flutter-sdk-${{ runner.os }}-3.41.6

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
          save-always: true

      - name: Cache CocoaPods spec repos
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods/repos
          key: cocoapods-repos-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: cocoapods-repos-${{ runner.os }}-
          save-always: true

      - name: Cache CocoaPods Pods dir
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-
          save-always: true

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: deriveddata-${{ runner.os }}-
          save-always: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Fastlane
        run: bundle install

      - name: Remove stale CocoaPods master spec repo
        run: rm -rf ~/.cocoapods/repos/master || true

      - name: Initialize CocoaPods CDN trunk
        run: bundle exec pod repo add-cdn trunk https://cdn.cocoapods.org/ 2>/dev/null || true
        env:
          COCOAPODS_DISABLE_STATS: 1

      - name: Install pod wrapper (unconditional no-op for pod install)
        # Flutter's `flutter build ipa` calls `pod install` mid-archive when
        # [CP] Check Pods Manifest.lock detects a mismatch. Calling the real
        # pod (even with --no-repo-update) hangs because CDN fetches individual
        # .podspec.json files lazily and those HTTPS requests hang on GHA runners.
        #
        # Safe to unconditionally exit 0 because ALL our explicit pod install
        # calls use `bundle exec pod` which resolves pod from the bundled gem
        # path (vendor/bundle/.../bin/pod) and BYPASSES this PATH wrapper.
        # So: real pod always runs first (bundle exec), wrapper only catches
        # Flutter's implicit call and makes it a no-op.
        #
        # Logs to /tmp/pod_wrapper.log so diagnostics step can read it even
        # if the build step hangs/is cancelled.
        run: |
          REAL_POD=$([[ -x /opt/homebrew/bin/pod ]] && echo /opt/homebrew/bin/pod || echo /usr/local/bin/pod)
          echo "Real pod: $REAL_POD ($($REAL_POD --version))"
          mkdir -p "$HOME/bin"
          printf '#!/bin/bash\n'                                                                        > "$HOME/bin/pod"
          printf 'echo "[WRAPPER] called from PWD=%s args=%s" "$PWD" "$*" >> /tmp/pod_wrapper.log\n'  >> "$HOME/bin/pod"
          printf 'if [[ "$1" == "install" ]]; then\n'                                                  >> "$HOME/bin/pod"
          printf '  echo "[WRAPPER] intercepted pod install - exiting 0 (no CDN)" >> /tmp/pod_wrapper.log\n' >> "$HOME/bin/pod"
          printf '  [[ -f "Podfile.lock" ]] && [[ -d "Pods" ]] && cp "Podfile.lock" "Pods/Manifest.lock"\n'  >> "$HOME/bin/pod"
          printf '  exit 0\n'                                                                          >> "$HOME/bin/pod"
          printf 'fi\n'                                                                                >> "$HOME/bin/pod"
          printf 'A=()\n'                                                                              >> "$HOME/bin/pod"
          printf 'for x in "$@"; do [[ "$x" != "--repo-update" ]] && A+=("$x"); done\n'               >> "$HOME/bin/pod"
          printf 'A+=("--no-repo-update")\n'                                                          >> "$HOME/bin/pod"
          printf 'exec "%s" "${A[@]}"\n' "$REAL_POD"                                                  >> "$HOME/bin/pod"
          chmod +x "$HOME/bin/pod"
          echo "--- wrapper ---" && cat "$HOME/bin/pod"
          echo "PATH=$HOME/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install CocoaPods
        run: cd ios && bundle exec pod install --no-repo-update
        env:
          COCOAPODS_DISABLE_STATS: 1

      - name: Replace bundled pod with no-op wrapper
        # Pods are now correctly installed (step above). Replace the actual
        # cocoapods gem binary with a Ruby no-op that exits 0 for 'pod install'.
        # MUST be Ruby (not bash): bundle exec uses Ruby's `load` to execute the
        # gem binary — a bash shebang causes a Ruby SyntaxError at load time.
        # The real pod is preserved as pod.real for non-install commands.
        run: |
          cd fastlane
          BUNDLE_POD=$(bundle exec ruby -e \
            "require 'rubygems'; spec = Gem::Specification.find_by_name('cocoapods'); puts File.join(spec.bin_dir, 'pod')")
          echo "Bundled pod path: $BUNDLE_POD"
          [[ -f "$BUNDLE_POD" ]] || { echo "ERROR: pod not found at $BUNDLE_POD"; exit 1; }
          cp "$BUNDLE_POD" "${BUNDLE_POD}.real"
          printf '#!/usr/bin/env ruby\n'                                                                                          > "$BUNDLE_POD"
          printf "require 'fileutils'\n"                                                                                         >> "$BUNDLE_POD"
          printf "log = '/tmp/pod_wrapper.log'\n"                                                                                >> "$BUNDLE_POD"
          printf "File.open(log,'a'){|f| f.puts \"[POD-NOOP] from #{Dir.pwd}: #{ARGV.inspect}\"}\n"                             >> "$BUNDLE_POD"
          printf "if ARGV[0] == 'install'\n"                                                                                     >> "$BUNDLE_POD"
          printf "  pl = File.join(Dir.pwd, 'Podfile.lock')\n"                                                                  >> "$BUNDLE_POD"
          printf "  pd = File.join(Dir.pwd, 'Pods')\n"                                                                          >> "$BUNDLE_POD"
          printf "  (FileUtils.cp(pl, File.join(pd,'Manifest.lock')) rescue nil) if File.exist?(pl) && Dir.exist?(pd)\n"       >> "$BUNDLE_POD"
          printf "  File.open(log,'a'){|f| f.puts '[POD-NOOP] install intercepted, exit 0'}\n"                                 >> "$BUNDLE_POD"
          printf "  exit 0\n"                                                                                                    >> "$BUNDLE_POD"
          printf "end\n"                                                                                                         >> "$BUNDLE_POD"
          printf 'load "#{__FILE__}.real"\n'                                                                                    >> "$BUNDLE_POD"
          echo "--- wrapper ---" && cat "$BUNDLE_POD"

      - name: Distribute staging iOS
        timeout-minutes: 90
        run: bundle exec fastlane ios distribute_staging_ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          COCOAPODS_DISABLE_STATS: 1

      - name: Pod wrapper diagnostics
        if: always()
        run: |
          echo "=== Pod wrapper call log ==="
          cat /tmp/pod_wrapper.log 2>/dev/null || echo "(wrapper was never called — pod resolved outside PATH)"
          echo "=== ~/bin/pod ==="
          cat "$HOME/bin/pod" 2>/dev/null || echo "(wrapper not found)"

      - name: Notify Slack — iOS failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Staging iOS distribution failed\nBranch: ${{ github.ref_name }}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── Job 4: Notify success when both platforms pass ───────────────────────────
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [distribute-android, distribute-ios]
    if: success()
    steps:
      - name: Notify Slack — success
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Staging distributed to Android + iOS\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
